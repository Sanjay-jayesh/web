<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect all unknown routes to index.html
      var path = window.location.pathname;
      window.location.href = "/" + path.replace(/^\//, '');
    </script>
  </head>
  <body></body>
</html>
