<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <script type="text/javascript">
        // Single-Page App (SPA) Router Fallback for GitHub Pages
        (function() {
            var redirect = sessionStorage.getItem('redirect');
            
            // 1. Check if we've already redirected (prevents infinite loop)
            if (redirect && redirect !== window.location.pathname) {
                sessionStorage.removeItem('redirect');
                window.location.replace(redirect);
                return;
            }

            // 2. Set the requested path in sessionStorage
            sessionStorage.setItem('redirect', window.location.pathname);
            
            // 3. Get the path to your repository root (e.g., /Portfolio-Cars)
            var pathSegmentsToKeep = 1; // You need the root (/) plus your repo name segment.
            
            // Split the full path (e.g., /Portfolio-Cars/test-route)
            var segments = window.location.pathname.split('/');
            
            // Re-join the base path (e.g., /Portfolio-Cars/)
            var newPath = segments.slice(0, pathSegmentsToKeep + 1).join('/');

            // 4. Redirect to the index page, which will now use the path stored in sessionStorage
            window.location.replace(newPath);
        })();
    </script>
</head>
<body>
    <p>If you are not redirected automatically, follow <a href="/">this link</a>.</p>
</body>
</html>
